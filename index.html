<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WeatherStation ESP32 · Clima CETYS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#0B1120;
color:white;
padding:24px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:#8fa8ff;
}

.current-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.card{
padding:30px;
border-radius:25px;
background:#1c2235;
}

.card-value{
font-size:60px;
font-weight:700;
}

.period-selector{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:30px;
}

.period-btn{
padding:12px 24px;
border:none;
border-radius:30px;
background:#1f2740;
color:white;
cursor:pointer;
}

.period-btn.active{
background:#6c8cff;
}

.charts-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.chart-card{
background:#1c2235;
padding:20px;
border-radius:25px;
}

.chart-wrapper{
height:300px;
}

.daily-stats{
margin-bottom:30px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.stat-card{
background:#1c2235;
padding:30px;
border-radius:25px;
text-align:center;
}

.stat-value{
font-size:45px;
font-weight:700;
}

.records{
margin-top:30px;
}

.records-header{
cursor:pointer;
font-size:20px;
margin-bottom:10px;
}

.records-table{
display:none;
overflow:auto;
max-height:400px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #333;
text-align:center;
}

.footer{
margin-top:40px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1><i class="fas fa-cloud-sun"></i> CETYS Weather Station</h1>
</div>


<div class="current-grid">

<div class="card">
<div>Temperature</div>
<div class="card-value" id="temp-valor">-- °C</div>
</div>

<div class="card">
<div>Humidity</div>
<div class="card-value" id="hum-valor">-- %</div>
</div>

</div>


<div class="period-selector">

<button class="period-btn" onclick="cambiarPeriodo(6,this)">6h</button>

<button class="period-btn" onclick="cambiarPeriodo(12,this)">12h</button>

<button class="period-btn active" onclick="cambiarPeriodo(24,this)">Today</button>

<button class="period-btn" onclick="cambiarPeriodo(168,this)">Week</button>

</div>


<div class="charts-grid">

<div class="chart-card">
<div>Temperature</div>
<div class="chart-wrapper">
<canvas id="graficaTemp"></canvas>
</div>
</div>

<div class="chart-card">
<div>Humidity</div>
<div class="chart-wrapper">
<canvas id="graficaHum"></canvas>
</div>
</div>

</div>


<div class="daily-stats">

<h2>Today's Averages</h2>

<div class="stats-grid">

<div class="stat-card">
<div>Temperature</div>
<div class="stat-value" id="promTemp">--</div>
</div>

<div class="stat-card">
<div>Humidity</div>
<div class="stat-value" id="promHum">--</div>
</div>

</div>

</div>


<!-- NUEVA SECCION REGISTROS -->

<div class="records">

<div class="records-header" onclick="toggleTabla()">

<i class="fas fa-table"></i> Registros

</div>

<div class="records-table" id="tablaRegistros">

<table>

<thead>

<tr>
<th>Date</th>
<th>Time</th>
<th>Temperature</th>
<th>Humidity</th>
</tr>

</thead>

<tbody id="tablaDatos"></tbody>

</table>

</div>

</div>


<div class="footer">
Weather Station ESP32 · Firebase
</div>

</div>



<script>

const firebaseConfig = {

apiKey:"APIKEY",
authDomain:"DOMAIN",
databaseURL:"DATABASEURL",
projectId:"PROJECTID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


let periodoHoras = 24;

let grafTemp;
let grafHum;

let datos=[];


function reducirDatos(data,max){

if(data.length<=max) return data;

const paso = Math.ceil(data.length/max);

let resultado=[];

for(let i=0;i<data.length;i+=paso){

resultado.push(data[i]);

}

return resultado;

}


function prepararDatos(data){

let limite=24;

if(periodoHoras==168) limite=40;

if(periodoHoras==6) limite=12;

if(periodoHoras==12) limite=18;

return reducirDatos(data,limite);

}



function crearGrafica(id,label,color){

return new Chart(

document.getElementById(id),

{

type:'line',

data:{
labels:[],
datasets:[{
label:label,
data:[],
borderColor:color,
tension:.3
}]
},

options:{
responsive:true,
plugins:{
legend:{display:false}
},
scales:{
x:{
ticks:{maxRotation:0}
}
}

}

}

);

}



grafTemp=crearGrafica("graficaTemp","Temp","#ff6b6b");

grafHum=crearGrafica("graficaHum","Hum","#4ecdc4");



function cambiarPeriodo(horas,btn){

periodoHoras=horas;

document.querySelectorAll(".period-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

cargarDatos();

}



function cargarDatos(){

const ahora=Date.now();

const limite=ahora-(periodoHoras*3600000);

db.ref("weather").once("value",snap=>{

datos=[];

snap.forEach(child=>{

const d=child.val();

if(d.timestamp>limite){

datos.push(d);

}

});

procesarDatos();

});

}



function procesarDatos(){

datos=prepararDatos(datos);

let labels=[];

let temp=[];

let hum=[];

let sumaT=0;

let sumaH=0;

datos.forEach(d=>{

let fecha=new Date(d.timestamp);

labels.push(fecha.toLocaleTimeString());

temp.push(d.temp);

hum.push(d.hum);

sumaT+=d.temp;

sumaH+=d.hum;

agregarTabla(fecha,d);

});


grafTemp.data.labels=labels;
grafTemp.data.datasets[0].data=temp;
grafTemp.update();

grafHum.data.labels=labels;
grafHum.data.datasets[0].data=hum;
grafHum.update();


if(datos.length>0){

document.getElementById("temp-valor").innerText=temp[temp.length-1]+" °C";

document.getElementById("hum-valor").innerText=hum[hum.length-1]+" %";

document.getElementById("promTemp").innerText=(sumaT/temp.length).toFixed(1);

document.getElementById("promHum").innerText=(sumaH/hum.length).toFixed(1);

}

}



function agregarTabla(fecha,d){

let fila=document.createElement("tr");

fila.innerHTML=`

<td>${fecha.toLocaleDateString()}</td>
<td>${fecha.toLocaleTimeString()}</td>
<td>${d.temp} °C</td>
<td>${d.hum} %</td>

`;

document.getElementById("tablaDatos").appendChild(fila);

}



function toggleTabla(){

const t=document.getElementById("tablaRegistros");

t.style.display=t.style.display=="block"?"none":"block";

}



cargarDatos();

</script>

</body>
</html>
