<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Climática</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .actual {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 10px;
        }
        .lecturas {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .lectura {
            text-align: center;
            flex: 1;
            min-width: 200px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }
        .valor {
            font-size: 4em;
            font-weight: bold;
        }
        .unidad {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .label {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.9;
        }
        .actualizado {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-style: italic;
        }
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .success {
            background: #51cf66;
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        tr:hover {
            background: #f5f5f5;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>🌡️ ESTACIÓN CLIMÁTICA ESP32</h1>
        
        <div id="error-message" class="error" style="display: none;"></div>
        <div id="success-message" class="success" style="display: none;"></div>
        
        <div class="actual">
            <h2>📊 LECTURAS EN TIEMPO REAL</h2>
            <div class="lecturas">
                <div class="lectura">
                    <div class="valor" id="temp-actual">--</div>
                    <div class="unidad">°C</div>
                    <div class="label">🌡️ Temperatura</div>
                </div>
                <div class="lectura">
                    <div class="valor" id="hum-actual">--</div>
                    <div class="unidad">%</div>
                    <div class="label">💧 Humedad</div>
                </div>
            </div>
            <div class="actualizado" id="ultima-actualizacion">
                ⏳ Esperando datos del ESP32...
            </div>
        </div>

        <div class="actual">
            <h2>📋 ÚLTIMAS LECTURAS</h2>
            <div id="historial">
                <p style="text-align: center;">Cargando historial...</p>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN DE FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyD_TJ1TZHviv7940B-rN0tWjPRRCqr-NbQ",
            authDomain: "estacion-climatica.firebaseapp.com",
            databaseURL: "https://estacion-climatica-default-rtdb.firebaseio.com/",
            projectId: "estacion-climatica",
            storageBucket: "estacion-climatica.firebasestorage.app",
            messagingSenderId: "845198169682",
            appId: "1:845198169682:web:fbce6efdf2e5b7c38eb18b"
        };

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.textContent = '❌ ' + mensaje;
            console.error(mensaje);
        }

        function mostrarExito(mensaje) {
            const successDiv = document.getElementById('success-message');
            successDiv.style.display = 'block';
            successDiv.textContent = '✅ ' + mensaje;
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function formatearFecha(timestamp) {
            if (!timestamp) return 'Fecha desconocida';
            const fecha = new Date(timestamp * 1000);
            return fecha.toLocaleString('es-MX', { 
                day: '2-digit', 
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Inicializar Firebase
        try {
            if (typeof firebase === 'undefined') {
                throw new Error('Las librerías de Firebase no se cargaron');
            }

            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase inicializado');
            
            const database = firebase.database();

            // ===== LECTURA ACTUAL =====
            const actualRef = database.ref('/actual');
            
            actualRef.on('value', (snapshot) => {
                const data = snapshot.val();
                console.log('📡 Actual:', data);
                
                if (data) {
                    document.getElementById('temp-actual').textContent = data.temperatura?.toFixed(1) || '--';
                    document.getElementById('hum-actual').textContent = data.humedad?.toFixed(1) || '--';
                    
                    if (data.timestamp) {
                        document.getElementById('ultima-actualizacion').innerHTML = 
                            `🕒 Última actualización: ${formatearFecha(data.timestamp)}`;
                    }
                    mostrarExito('Datos actualizados');
                }
            }, (error) => {
                mostrarError('Error leyendo datos actuales: ' + error.message);
            });

            // ===== HISTORIAL =====
            const historialRef = database.ref('/lecturas');
            
            historialRef.limitToLast(20).on('value', (snapshot) => {
                const data = snapshot.val();
                console.log('📡 Historial:', data);
                
                const historialDiv = document.getElementById('historial');
                
                if (!data) {
                    historialDiv.innerHTML = '<p style="text-align: center;">No hay lecturas en el historial</p>';
                    return;
                }
                
                // Convertir a array y ordenar
                const lecturas = Object.entries(data).map(([key, value]) => ({
                    id: key,
                    ...value
                }));
                
                lecturas.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                let html = '<table>';
                html += '<tr><th>Fecha</th><th>Temperatura</th><th>Humedad</th></tr>';
                
                lecturas.slice(0, 15).forEach(lectura => {
                    if (lectura && lectura.temperatura && lectura.humedad) {
                        html += '<tr>';
                        html += `<td>${formatearFecha(lectura.timestamp)}</td>`;
                        html += `<td>${lectura.temperatura.toFixed(1)} °C</td>`;
                        html += `<td>${lectura.humedad.toFixed(1)} %</td>`;
                        html += '</tr>';
                    }
                });
                
                html += '</table>';
                historialDiv.innerHTML = html;
                mostrarExito('Historial cargado');
                
            }, (error) => {
                mostrarError('Error cargando historial: ' + error.message);
                historialDiv.innerHTML = '<p style="text-align: center; color: red;">Error: ' + error.message + '</p>';
            });

        } catch (error) {
            mostrarError('Error al inicializar: ' + error.message);
        }
    </script>
</body>
</html>
