<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Climática ESP32</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: 3.5em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            font-weight: 300;
        }

        /* Tarjetas de lecturas actuales (MANTENEMOS TU DISEÑO) */
        .current-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: white;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }

        .card.temperatura {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        }

        .card.humedad {
            background: linear-gradient(135deg, #4ecdc4, #45b7af);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
            text-align: center;
        }

        .card-label {
            font-size: 1.2em;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 5em;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card-unit {
            font-size: 1.2em;
            text-align: center;
            opacity: 0.8;
        }

        .timestamp {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 50px;
        }

        /* Selector de período */
        .period-selector-container {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .period-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .period-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .period-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .period-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* Contenedor de gráficas */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .chart-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-title i {
            margin-right: 10px;
        }

        .chart-title.temp i { color: #ff6b6b; }
        .chart-title.hum i { color: #4ecdc4; }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        /* Estadísticas diarias */
        .daily-stats {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .daily-stats h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-icon.temp { color: #ff6b6b; }
        .stat-icon.hum { color: #4ecdc4; }

        .stat-label {
            color: #666;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-period {
            color: #999;
            font-size: 0.9em;
        }

        /* Alertas */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: #51cf66;
            color: white;
        }

        .alert-info {
            background: #339af0;
            color: white;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .current-grid { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .card-value { font-size: 3.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-microchip"></i> 
                ESTACIÓN CLIMÁTICA ESP32
                <i class="fas fa-cloud-sun"></i>
            </h1>
            <div class="subtitle">
                <i class="fas fa-map-marker-alt"></i>
                Monitoreo en tiempo real
                <i class="fas fa-wifi"></i>
            </div>
        </div>

        <!-- Alertas -->
        <div id="alert-container"></div>

        <!-- Tarjetas actuales (TU DISEÑO) -->
        <div class="current-grid">
            <div class="card temperatura">
                <div class="card-icon">
                    <i class="fas fa-thermometer-half"></i>
                </div>
                <div class="card-label">TEMPERATURA</div>
                <div class="card-value" id="temp-valor">--</div>
                <div class="card-unit">grados Celsius</div>
                <div class="timestamp" id="temp-timestamp">
                    <i class="far fa-clock"></i> Actualizando...
                </div>
            </div>
            <div class="card humedad">
                <div class="card-icon">
                    <i class="fas fa-tint"></i>
                </div>
                <div class="card-label">HUMEDAD</div>
                <div class="card-value" id="hum-valor">--</div>
                <div class="card-unit">porcentaje</div>
                <div class="timestamp" id="hum-timestamp">
                    <i class="far fa-clock"></i> Actualizando...
                </div>
            </div>
        </div>

        <!-- Selector de período -->
        <div class="period-selector-container">
            <div class="period-selector">
                <button class="period-btn active" onclick="cambiarPeriodo(7)">7 DÍAS</button>
                <button class="period-btn" onclick="cambiarPeriodo(15)">15 DÍAS</button>
                <button class="period-btn" onclick="cambiarPeriodo(30)">30 DÍAS</button>
                <button class="period-btn" onclick="cambiarPeriodo(45)">45 DÍAS</button>
                <button class="period-btn" onclick="cambiarPeriodo(60)">60 DÍAS</button>
            </div>
        </div>

        <!-- Gráficas separadas -->
        <div class="charts-grid">
            <!-- Gráfica de Temperatura -->
            <div class="chart-card">
                <div class="chart-title temp">
                    <i class="fas fa-thermometer-half"></i> Temperatura
                </div>
                <div class="chart-wrapper">
                    <canvas id="grafica-temp"></canvas>
                </div>
            </div>
            
            <!-- Gráfica de Humedad -->
            <div class="chart-card">
                <div class="chart-title hum">
                    <i class="fas fa-tint"></i> Humedad
                </div>
                <div class="chart-wrapper">
                    <canvas id="grafica-hum"></canvas>
                </div>
            </div>
        </div>

        <!-- Estadísticas diarias -->
        <div class="daily-stats">
            <h2>
                <i class="fas fa-calendar-day"></i>
                Promedios del Día
            </h2>
            <div class="stats-grid" id="daily-stats">
                <div class="stat-card">
                    <div class="stat-icon temp">
                        <i class="fas fa-thermometer-half"></i>
                    </div>
                    <div class="stat-label">Temperatura Promedio</div>
                    <div class="stat-value" id="prom-temp">--</div>
                    <div class="stat-unit">°C</div>
                    <div class="stat-period" id="prom-temp-period">Hoy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon hum">
                        <i class="fas fa-tint"></i>
                    </div>
                    <div class="stat-label">Humedad Promedio</div>
                    <div class="stat-value" id="prom-hum">--</div>
                    <div class="stat-unit">%</div>
                    <div class="stat-period" id="prom-hum-period">Hoy</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>
                <i class="fas fa-heart"></i>
                Datos actualizados cada minuto · Conectado a Firebase
                <i class="fas fa-heart"></i>
            </p>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyD_TJ1TZHviv7940B-rN0tWjPRRCqr-NbQ",
            authDomain: "estacion-climatica.firebaseapp.com",
            databaseURL: "https://estacion-climatica-default-rtdb.firebaseio.com/",
            projectId: "estacion-climatica",
            storageBucket: "estacion-climatica.firebasestorage.app",
            messagingSenderId: "845198169682",
            appId: "1:845198169682:web:fbce6efdf2e5b7c38eb18b"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Variables globales
        let chartTemp, chartHum;
        let lecturasGlobales = [];
        let periodoActual = 7; // días por defecto

        // ===== FUNCIONES DE UTILIDAD =====
        function mostrarAlerta(tipo, mensaje) {
            const alertContainer = document.getElementById('alert-container');
            const alerta = document.createElement('div');
            alerta.className = `alert alert-${tipo}`;
            alerta.innerHTML = `
                <i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                <span>${mensaje}</span>
            `;
            alertContainer.appendChild(alerta);
            
            setTimeout(() => {
                alerta.remove();
            }, 3000);
        }

        function formatearFecha(timestamp) {
            if (!timestamp) return 'Fecha desconocida';
            const fecha = new Date(timestamp * 1000);
            return fecha.toLocaleDateString('es-MX', { 
                day: '2-digit',
                month: '2-digit'
            });
        }

        function formatearFechaCompleta(timestamp) {
            if (!timestamp) return 'Fecha desconocida';
            const fecha = new Date(timestamp * 1000);
            return fecha.toLocaleString('es-MX', { 
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ===== ACTUALIZAR LECTURAS ACTUALES =====
        const actualRef = database.ref('/actual');
        actualRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('temp-valor').textContent = data.temperatura?.toFixed(1) || '--';
                document.getElementById('hum-valor').textContent = data.humedad?.toFixed(1) || '--';
                
                const fechaActual = formatearFechaCompleta(data.timestamp);
                document.getElementById('temp-timestamp').innerHTML = `<i class="far fa-clock"></i> ${fechaActual}`;
                document.getElementById('hum-timestamp').innerHTML = `<i class="far fa-clock"></i> ${fechaActual}`;
                
                mostrarAlerta('success', '📡 Datos actualizados');
            }
        });

        // ===== CARGAR HISTORIAL =====
        function cargarHistorial(dias = 7) {
            const historialRef = database.ref('/lecturas');
            const limiteMs = dias * 24 * 60 * 60 * 1000;
            const tiempoLimite = Date.now() - limiteMs;
            
            historialRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Convertir a array y filtrar
                lecturasGlobales = Object.entries(data)
                    .map(([key, value]) => ({
                        id: key,
                        ...value,
                        timestampMs: value.timestamp * 1000,
                        fecha: new Date(value.timestamp * 1000)
                    }))
                    .filter(l => l.timestampMs > tiempoLimite)
                    .sort((a, b) => a.timestampMs - b.timestampMs);

                actualizarGraficas();
                actualizarPromediosDiarios();
                
                mostrarAlerta('info', `📊 Mostrando últimos ${dias} días`);
            });
        }

        // ===== ACTUALIZAR GRÁFICAS =====
        function actualizarGraficas() {
            if (lecturasGlobales.length === 0) return;

            const fechas = lecturasGlobales.map(l => {
                const f = l.fecha;
                return `${f.getDate()}/${f.getMonth()+1}`;
            });

            const temperaturas = lecturasGlobales.map(l => l.temperatura);
            const humedades = lecturasGlobales.map(l => l.humedad);

            // Configuración común para ambas gráficas
            const opcionesBase = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        titleColor: 'white',
                        bodyColor: 'white',
                        padding: 12,
                        cornerRadius: 8
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { maxRotation: 45, minRotation: 45 }
                    },
                    y: {
                        beginAtZero: false,
                        grid: { color: 'rgba(0,0,0,0.1)' }
                    }
                }
            };

            // Gráfica de Temperatura
            const ctxTemp = document.getElementById('grafica-temp').getContext('2d');
            if (chartTemp) chartTemp.destroy();
            
            chartTemp = new Chart(ctxTemp, {
                type: 'line',
                data: {
                    labels: fechas,
                    datasets: [{
                        label: 'Temperatura',
                        data: temperaturas,
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        borderWidth: 3,
                        pointRadius: 3,
                        pointHoverRadius: 7,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    ...opcionesBase,
                    plugins: {
                        ...opcionesBase.plugins,
                        title: {
                            display: true,
                            text: 'Evolución de Temperatura',
                            color: '#ff6b6b',
                            font: { size: 14, weight: 'bold' }
                        }
                    }
                }
            });

            // Gráfica de Humedad
            const ctxHum = document.getElementById('grafica-hum').getContext('2d');
            if (chartHum) chartHum.destroy();
            
            chartHum = new Chart(ctxHum, {
                type: 'line',
                data: {
                    labels: fechas,
                    datasets: [{
                        label: 'Humedad',
                        data: humedades,
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        borderWidth: 3,
                        pointRadius: 3,
                        pointHoverRadius: 7,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    ...opcionesBase,
                    scales: {
                        ...opcionesBase.scales,
                        y: {
                            ...opcionesBase.scales.y,
                            min: 0,
                            max: 100
                        }
                    },
                    plugins: {
                        ...opcionesBase.plugins,
                        title: {
                            display: true,
                            text: 'Evolución de Humedad',
                            color: '#4ecdc4',
                            font: { size: 14, weight: 'bold' }
                        }
                    }
                }
            });
        }

        // ===== ACTUALIZAR PROMEDIOS DIARIOS =====
        function actualizarPromediosDiarios() {
            if (lecturasGlobales.length === 0) return;

            // Filtrar lecturas de hoy
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            
            const lecturasHoy = lecturasGlobales.filter(l => {
                const fechaLectura = new Date(l.timestampMs);
                fechaLectura.setHours(0, 0, 0, 0);
                return fechaLectura.getTime() === hoy.getTime();
            });

            if (lecturasHoy.length > 0) {
                const sumTemp = lecturasHoy.reduce((acc, l) => acc + l.temperatura, 0);
                const sumHum = lecturasHoy.reduce((acc, l) => acc + l.humedad, 0);
                
                const promTemp = sumTemp / lecturasHoy.length;
                const promHum = sumHum / lecturasHoy.length;
                
                document.getElementById('prom-temp').textContent = promTemp.toFixed(1);
                document.getElementById('prom-hum').textContent = promHum.toFixed(1);
                
                const fechaStr = hoy.toLocaleDateString('es-MX', { 
                    day: '2-digit', 
                    month: '2-digit',
                    year: 'numeric'
                });
                document.getElementById('prom-temp-period').textContent = fechaStr;
                document.getElementById('prom-hum-period').textContent = fechaStr;
            } else {
                document.getElementById('prom-temp').textContent = '--';
                document.getElementById('prom-hum').textContent = '--';
                document.getElementById('prom-temp-period').textContent = 'Sin datos hoy';
                document.getElementById('prom-hum-period').textContent = 'Sin datos hoy';
            }
        }

        // ===== CAMBIAR PERÍODO =====
        function cambiarPeriodo(dias) {
            periodoActual = dias;
            
            // Actualizar botones
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(dias + ' DÍAS')) {
                    btn.classList.add('active');
                }
            });
            
            // Recargar datos
            cargarHistorial(dias);
        }

        // ===== INICIALIZAR =====
        window.onload = () => {
            cargarHistorial(7);
            
            // Actualizar cada 5 minutos
            setInterval(() => {
                cargarHistorial(periodoActual);
            }, 300000);
        };
    </script>
</body>
</html>
