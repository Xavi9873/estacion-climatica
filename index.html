<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Climática ESP32</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .current-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            border-radius: 20px;
            padding: 25px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card.temperatura { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
        .card.humedad { background: linear-gradient(135deg, #4ecdc4, #45b7af); }
        
        .card-icon { font-size: 2.5em; text-align: center; margin-bottom: 10px; }
        .card-label { text-align: center; font-size: 1.1em; text-transform: uppercase; margin-bottom: 10px; }
        .card-value { font-size: 4em; font-weight: bold; text-align: center; line-height: 1; }
        .card-unit { text-align: center; font-size: 0.9em; opacity: 0.9; margin-top: 5px; }
        .timestamp { text-align: center; font-size: 0.8em; background: rgba(255,255,255,0.2); padding: 8px; border-radius: 50px; margin-top: 15px; }
        
        .period-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .period-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .period-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .period-btn.active { background: #667eea; color: white; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 400px;
        }
        
        .chart-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .chart-title.temp { color: #ff6b6b; }
        .chart-title.hum { color: #4ecdc4; }
        
        .chart-wrapper { position: relative; height: calc(100% - 50px); width: 100%; }
        
        .daily-stats {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .daily-stats h2 { color: #333; margin-bottom: 20px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-icon { font-size: 2em; margin-bottom: 10px; }
        .stat-icon.temp { color: #ff6b6b; }
        .stat-icon.hum { color: #4ecdc4; }
        .stat-label { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #333; }
        .stat-unit { font-size: 0.9em; color: #999; margin-left: 5px; }
        
        .footer { text-align: center; margin-top: 30px; color: rgba(255,255,255,0.8); }
        
        @media (max-width: 768px) {
            .current-grid, .charts-grid, .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-microchip"></i> ESTACIÓN CLIMÁTICA ESP32</h1>
        </div>

        <div class="current-grid">
            <div class="card temperatura">
                <div class="card-icon"><i class="fas fa-thermometer-half"></i></div>
                <div class="card-label">TEMPERATURA</div>
                <div class="card-value" id="temp-valor">--</div>
                <div class="card-unit">°C</div>
                <div class="timestamp" id="temp-timestamp"><i class="far fa-clock"></i> --</div>
            </div>
            <div class="card humedad">
                <div class="card-icon"><i class="fas fa-tint"></i></div>
                <div class="card-label">HUMEDAD</div>
                <div class="card-value" id="hum-valor">--</div>
                <div class="card-unit">%</div>
                <div class="timestamp" id="hum-timestamp"><i class="far fa-clock"></i> --</div>
            </div>
        </div>

        <div class="period-selector">
            <button class="period-btn active" onclick="cambiarPeriodo(24)">24 HORAS</button>
            <button class="period-btn" onclick="cambiarPeriodo(72)">3 DÍAS</button>
            <button class="period-btn" onclick="cambiarPeriodo(168)">7 DÍAS</button>
            <button class="period-btn" onclick="cambiarPeriodo(720)">30 DÍAS</button>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title temp"><i class="fas fa-thermometer-half"></i> Temperatura (°C)</div>
                <div class="chart-wrapper"><canvas id="grafica-temp"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title hum"><i class="fas fa-tint"></i> Humedad (%)</div>
                <div class="chart-wrapper"><canvas id="grafica-hum"></canvas></div>
            </div>
        </div>

        <div class="daily-stats">
            <h2><i class="fas fa-calendar-day"></i> Promedios del Día</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon temp"><i class="fas fa-thermometer-half"></i></div>
                    <div class="stat-label">Temperatura Promedio</div>
                    <div class="stat-value" id="prom-temp">--<span class="stat-unit">°C</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon hum"><i class="fas fa-tint"></i></div>
                    <div class="stat-label">Humedad Promedio</div>
                    <div class="stat-value" id="prom-hum">--<span class="stat-unit">%</span></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Datos actualizados cada minuto · Hora real vía NTP</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_TJ1TZHviv7940B-rN0tWjPRRCqr-NbQ",
            authDomain: "estacion-climatica.firebaseapp.com",
            databaseURL: "https://estacion-climatica-default-rtdb.firebaseio.com/",
            projectId: "estacion-climatica",
            storageBucket: "estacion-climatica.firebasestorage.app",
            messagingSenderId: "845198169682",
            appId: "1:845198169682:web:fbce6efdf2e5b7c38eb18b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let chartTemp, chartHum;
        let lecturasGlobales = [];
        let periodoActual = 24;

        // ===== FUNCIONES DE FORMATEO =====
        function formatearHora(timestamp) {
            if (!timestamp || timestamp < 100000) return '--:--';
            const fecha = new Date(timestamp * 1000);
            return fecha.toLocaleTimeString('es-MX', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false
            });
        }

        function formatearFechaHora(timestamp) {
            if (!timestamp || timestamp < 100000) return 'Fecha no disponible';
            const fecha = new Date(timestamp * 1000);
            return fecha.toLocaleString('es-MX', { 
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ===== LECTURAS ACTUALES =====
        database.ref('/actual').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.timestamp > 100000) { // Ignorar timestamps inválidos
                document.getElementById('temp-valor').textContent = data.temperatura?.toFixed(1) || '--';
                document.getElementById('hum-valor').textContent = data.humedad?.toFixed(1) || '--';
                
                const fecha = formatearFechaHora(data.timestamp);
                document.getElementById('temp-timestamp').innerHTML = `<i class="far fa-clock"></i> ${fecha}`;
                document.getElementById('hum-timestamp').innerHTML = `<i class="far fa-clock"></i> ${fecha}`;
            }
        });

        // ===== CARGAR HISTORIAL =====
        function cargarHistorial(horas) {
            periodoActual = horas;
            
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(horas + (horas === 24 ? ' HORAS' : ' DÍAS'))) {
                    btn.classList.add('active');
                }
            });

            const historialRef = database.ref('/lecturas');
            const limiteMs = horas * 60 * 60 * 1000;
            const tiempoLimite = Date.now() - limiteMs;
            
            historialRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                lecturasGlobales = Object.entries(data)
                    .map(([key, value]) => ({
                        ...value,
                        id: key,
                        timestampMs: value.timestamp * 1000
                    }))
                    .filter(l => l.timestamp > 100000 && l.timestampMs > tiempoLimite) // Filtrar timestamps inválidos
                    .sort((a, b) => a.timestamp - b.timestamp);

                if (lecturasGlobales.length > 0) {
                    actualizarGraficas();
                    actualizarPromedios();
                }
            });
        }

        // ===== ACTUALIZAR GRÁFICAS (CORREGIDO) =====
        function actualizarGraficas() {
            if (lecturasGlobales.length === 0) return;

            // Eje X: horas del día
            const horas = lecturasGlobales.map(l => formatearHora(l.timestamp));
            const temperaturas = lecturasGlobales.map(l => l.temperatura);
            const humedades = lecturasGlobales.map(l => l.humedad);

            const opcionesBase = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                const data = lecturasGlobales[context.dataIndex];
                                return `${context.raw.toFixed(1)} (${formatearFechaHora(data.timestamp)})`;
                            }
                        }
                    }
                },
                scales: {
                    x: { 
                        title: { display: true, text: 'Hora del día' },
                        ticks: { maxRotation: 45, minRotation: 45 }
                    },
                    y: { 
                        beginAtZero: false,
                        title: { display: true, text: 'Valor' }
                    }
                }
            };

            // Gráfica de Temperatura
            const ctxTemp = document.getElementById('grafica-temp').getContext('2d');
            if (chartTemp) chartTemp.destroy();
            
            chartTemp = new Chart(ctxTemp, {
                type: 'line',
                data: {
                    labels: horas,
                    datasets: [{
                        label: 'Temperatura (°C)',
                        data: temperaturas,
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: opcionesBase
            });

            // Gráfica de Humedad
            const ctxHum = document.getElementById('grafica-hum').getContext('2d');
            if (chartHum) chartHum.destroy();
            
            chartHum = new Chart(ctxHum, {
                type: 'line',
                data: {
                    labels: horas,
                    datasets: [{
                        label: 'Humedad (%)',
                        data: humedades,
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78, 205, 196, 0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    ...opcionesBase,
                    scales: {
                        ...opcionesBase.scales,
                        y: { ...opcionesBase.scales.y, min: 0, max: 100 }
                    }
                }
            });
        }

        // ===== ACTUALIZAR PROMEDIOS =====
        function actualizarPromedios() {
            if (lecturasGlobales.length === 0) return;

            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const hoyTimestamp = hoy.getTime() / 1000;
            
            const lecturasHoy = lecturasGlobales.filter(l => {
                const fecha = new Date(l.timestamp * 1000);
                fecha.setHours(0, 0, 0, 0);
                return fecha.getTime() / 1000 === hoyTimestamp;
            });

            if (lecturasHoy.length > 0) {
                const sumTemp = lecturasHoy.reduce((acc, l) => acc + l.temperatura, 0);
                const sumHum = lecturasHoy.reduce((acc, l) => acc + l.humedad, 0);
                
                document.getElementById('prom-temp').innerHTML = 
                    (sumTemp / lecturasHoy.length).toFixed(1) + '<span class="stat-unit">°C</span>';
                document.getElementById('prom-hum').innerHTML = 
                    (sumHum / lecturasHoy.length).toFixed(1) + '<span class="stat-unit">%</span>';
            } else {
                document.getElementById('prom-temp').innerHTML = '--<span class="stat-unit">°C</span>';
                document.getElementById('prom-hum').innerHTML = '--<span class="stat-unit">%</span>';
            }
        }

        // ===== CAMBIAR PERÍODO =====
        function cambiarPeriodo(horas) {
            cargarHistorial(horas);
        }

        // ===== INICIALIZAR =====
        window.onload = () => {
            cargarHistorial(24);
            setInterval(() => cargarHistorial(periodoActual), 60000);
        };
    </script>
</body>
</html>
